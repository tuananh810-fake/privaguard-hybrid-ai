name: Verify PrivaGuard AI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Typecheck, Unit Tests, Eval, Stress, Web & Extension Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run full web verification gate
        run: npm run verify

      - name: Typecheck Chrome Extension (strict)
        run: npx tsc --ignoreConfig --noEmit --strict --allowImportingTsExtensions --target ES2022 --module ESNext --moduleResolution bundler --skipLibCheck extension/src/chrome.d.ts extension/src/background.ts extension/src/content.ts extension/src/editorAdapter.ts extension/src/fileInterceptor.ts extension/src/shieldBar.ts extension/src/offscreen.ts extension/src/popup.ts src/vite-env.d.ts

      - name: Build Chrome Extension (MV3)
        run: npm run build:extension

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PrivaGuard AI Shield</title>
    <style>
      :root {
        --bg: #ffffff;
        --surface: #f7f7f5;
        --border: #e5e5e0;
        --text: #1f1f1c;
        --muted: #6b6b63;
        --accent: #0f766e;
        --accent-soft: #ecfdf5;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #191918;
          --surface: #232321;
          --border: #33332f;
          --text: #f3f3ef;
          --muted: #a1a199;
          --accent: #2dd4bf;
          --accent-soft: #132a27;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        width: 320px;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 13px;
        line-height: 1.45;
      }
      .wrap { padding: 14px; display: flex; flex-direction: column; gap: 12px; }
      .header { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
      .brand { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px; }
      .dot { width: 8px; height: 8px; border-radius: 999px; background: var(--accent); display: inline-block; }
      .dot.off { background: #9ca3af; }
      .badge {
        font-size: 11px;
        padding: 2px 7px;
        border-radius: 999px;
        background: var(--surface);
        border: 1px solid var(--border);
        color: var(--muted);
      }
      .badge.ready { background: var(--accent-soft); color: var(--accent); border-color: transparent; font-weight: 500; }
      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 10px 12px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
      .label-title { font-weight: 500; font-size: 13px; }
      .label-sub { font-size: 11.5px; color: var(--muted); margin-top: 1px; }
      input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--accent); cursor: pointer; }
      .stat { display: flex; align-items: baseline; justify-content: space-between; }
      .stat-num { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--accent); }
      .btn {
        display: block;
        width: 100%;
        text-align: center;
        text-decoration: none;
        background: var(--accent);
        color: #ffffff;
        font-weight: 600;
        font-size: 12.5px;
        padding: 9px 12px;
        border-radius: 7px;
        border: none;
        cursor: pointer;
      }
      .btn:hover { opacity: 0.92; }
      .foot { font-size: 11px; color: var(--muted); text-align: center; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="header">
        <div class="brand">
          <span id="status-dot" class="dot"></span>
          <span>PrivaGuard AI</span>
        </div>
        <span id="nano-badge" class="badge">Checking Nano…</span>
      </div>

      <div class="card">
        <label class="row">
          <div>
            <div class="label-title">Privacy Shield</div>
            <div class="label-sub">Watch Gemini, ChatGPT &amp; Claude inputs</div>
          </div>
          <input id="toggle-enabled" type="checkbox" checked />
        </label>

        <label class="row">
          <div>
            <div class="label-title">Smart Context Guard</div>
            <div class="label-sub">Keep homework/lab data intact; block real secrets</div>
          </div>
          <input id="toggle-smart" type="checkbox" checked />
        </label>
      </div>

      <div class="card">
        <div class="stat">
          <div>
            <div class="label-title">Secrets shielded locally</div>
            <div class="label-sub">0 B raw PII sent · RAM-only vault</div>
          </div>
          <span id="shielded-count" class="stat-num">0</span>
        </div>
      </div>

      <a
        class="btn"
        href="https://buildhybridai-tuananh.web.app"
        target="_blank"
        rel="noopener noreferrer"
      >
        Open Web Workspace (PDF / OCR / Offline) →
      </a>

      <div class="foot">100% on-device · zero tracking · MIT open-source</div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
